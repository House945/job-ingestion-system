services:
  backend:
    build: ./backend
    command: >
      uv run uvicorn jobs.api.main:app
      --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - ./data:/data:ro
    environment:
      JOBS_FEED_PATH: /data/jobs.json
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "8080:80"
    depends_on:
      - backend
