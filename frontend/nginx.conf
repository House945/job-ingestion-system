server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths resolve to the entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The frontend never holds a backend address. In development Vite proxies
    # /api; in production nginx does the same job, so the client code is
    # identical in both environments.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hashed asset filenames make long caching safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}